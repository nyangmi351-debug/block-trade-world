<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>블록 무역 월드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: full-screen 3D block island. HUD = mission card top-left, day bar top-center, minimap + ranking top-right, hearts + inventory bottom-center, chat bottom-left, touch pad on tablets. Teacher console slides in from the right over the live map. Chunky dark "stone" panels with hard shadows; one look by choice. */
:root{
  --panel:rgba(30,34,42,.93); --edge:#0E1116; --hi:#5B6577; --well:#1A1E25;
  --ink:#F6F2E6; --ink-2:#C2C8D0; --gold:#FFD34E; --gold-ink:#3A2600;
  --good:#7EE07A; --bad:#FF8A7A; --blue:#7CC4FF;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#9BD0FF;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hurt{position:fixed;inset:0;pointer-events:none;display:none;border:18px solid rgba(220,30,30,.55)}
#hurt.on{display:block}
#tagcv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#hud .pane,.toast{box-shadow:none}
.pane{background:var(--panel);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--hi),4px 4px 0 rgba(0,0,0,.35);border-radius:4px}
.btn{background:linear-gradient(#59616F,#3B424E);border:3px solid var(--edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.3);border-radius:4px;padding:9px 16px;font-weight:900;font-size:17px}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.gold{background:linear-gradient(#FFE07A,#E9B826);color:var(--gold-ink)}
.btn.green{background:linear-gradient(#8FE07A,#4CA83C);color:#0E2A08}
.btn.red{background:linear-gradient(#FF8A7A,#C9443A);color:#2A0804}
.btn.small{padding:5px 10px;font-size:14px}
.field{background:var(--well);border:3px solid var(--edge);border-radius:4px;padding:9px 12px;font-size:18px}
.ico{image-rendering:pixelated;display:inline-block;vertical-align:middle}
.eyebrow{font-size:14px;font-weight:900;letter-spacing:1px;color:var(--gold)}
.muted{color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{display:none}
.tag b{display:block;background:rgba(14,17,22,.78);border:2px solid var(--c);padding:1px 9px;border-radius:4px;font-size:16px}
.tag small{display:block;font-size:13px;color:var(--gold);text-shadow:0 1px 2px #000;font-weight:900}
.tag .star{font-size:24px;line-height:1;animation:bob 1s ease-in-out infinite}
.tag .say{display:block;max-width:240px;white-space:normal;background:#F6F2E6;color:#14161A;border:2px solid var(--edge);border-radius:8px;padding:3px 9px;margin-bottom:4px;font-size:15px;font-weight:700}
.tag.me b{border-color:var(--gold);background:rgba(58,38,0,.85)}
@keyframes bob{50%{transform:translateY(-5px)}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#mission{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 24px));padding:10px 12px;display:flex;flex-direction:column;gap:7px}
#mission .mh{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px}
#mission .why{font-size:15px;color:var(--ink-2)}
.needs{display:flex;flex-wrap:wrap;gap:6px}
.need{display:flex;align-items:center;gap:5px;background:var(--well);border:2px solid var(--edge);border-radius:4px;padding:3px 8px;font-weight:900}
.need.ok{border-color:var(--good);color:var(--good)}
#day{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));padding:7px 14px;display:flex;align-items:center;gap:10px;font-weight:900;white-space:nowrap}
#day .bar{width:120px;height:12px;background:var(--well);border:2px solid var(--edge);overflow:hidden}
#day .bar i{display:block;height:100%;background:linear-gradient(90deg,#FFE07A,#FF9E4E)}
#side{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#mini{width:160px;height:160px;image-rendering:pixelated;border:3px solid var(--edge);box-shadow:4px 4px 0 rgba(0,0,0,.35);border-radius:4px;background:#2F6FB5}
#rank{width:160px;padding:7px 9px;font-size:14px;max-height:calc(100vh - 330px);overflow:auto}
#rank h3{font-size:16px;margin-bottom:3px}
#rank ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
#rank li{display:flex;gap:5px;align-items:center}
#rank li.me{color:var(--gold);font-weight:900}
#rank li span:nth-child(3){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:76px}
#rank li span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.dot{width:11px;height:11px;border:2px solid var(--edge);flex:none}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(600px,90vw)}
.toast{padding:8px 16px;font-weight:900;font-size:17px;text-align:center;animation:pop .25s ease-out}
.toast.good{color:var(--good)}.toast.gold{color:var(--gold)}.toast.bad{color:var(--bad)}.toast.blue{color:var(--blue)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#notice{position:absolute;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));padding:10px 18px;font-size:19px;font-weight:900;color:var(--gold);max-width:min(700px,90vw);text-align:center;border-color:var(--gold)}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));font-size:19px;padding:10px 20px}
#bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:4px;max-width:calc(100vw - 24px)}
#hearts{font-size:19px;letter-spacing:1px;filter:drop-shadow(2px 2px 0 #000)}
#hotbar{display:flex;gap:4px;padding:5px;flex-wrap:wrap;justify-content:center}
.slot{position:relative;width:56px;height:56px;background:var(--well);border:3px solid var(--edge);display:grid;place-items:center}
.slot.need{border-color:var(--gold)}
.slot img{width:36px;height:36px}
.slot b{position:absolute;right:3px;bottom:0;font-size:16px;text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
#chat{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100vw - 24px));display:flex;flex-direction:column;gap:6px}
#chatlog{display:flex;flex-direction:column;gap:3px;max-height:170px;overflow:hidden;justify-content:flex-end;font-size:15px}
#chatlog p{background:rgba(14,17,22,.7);padding:3px 8px;border-radius:4px;text-shadow:0 1px 1px #000;word-break:break-all}
#chatlog p b{color:var(--gold)}
#chatlog p.t b{color:var(--blue)}
#chatform{display:flex;gap:6px}
#chatin{flex:1;min-width:0;font-size:16px;padding:7px 10px}
#tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
#tools .btn{width:56px;height:56px;padding:0;font-size:24px}
#joy{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(250px + env(safe-area-inset-bottom,0px));width:126px;height:126px;border-radius:50%;background:rgba(14,17,22,.35);border:3px solid rgba(255,255,255,.35);touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#tbtn{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#tbtn button{width:72px;height:72px;border-radius:50%;font-size:28px;padding:0}
#offer{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(190px + env(safe-area-inset-bottom,0px));padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-color:var(--gold);max-width:min(560px,92vw)}
#frozen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,20,40,.55);pointer-events:none}
#frozen div{padding:20px 28px;font-size:24px;font-weight:900;text-align:center}
/* overlays */
#screen{position:fixed;inset:0;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(8,12,18,.45);overflow:auto}
.card{width:min(1040px,100%);max-height:100%;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.card h1{font-size:clamp(44px,7vw,74px);line-height:1;color:var(--gold);text-shadow:4px 4px 0 #3A2600}
.card h2{font-size:clamp(26px,3.2vw,36px);color:var(--gold)}
.big{font-size:20px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.choice{text-align:left;background:var(--well);border:3px solid var(--edge);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:6px}
.choice:hover{border-color:var(--gold)}
.choice b{font-family:var(--display);font-size:24px;font-weight:400}
.choice .em{font-size:40px}
.ngrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ncard{text-align:left;background:var(--well);border:3px solid var(--edge);border-radius:4px;padding:9px;display:flex;flex-direction:column;gap:5px}
.ncard[aria-pressed="true"]{border-color:var(--gold)}
.ncard b{font-size:17px}
.ncard small{color:var(--ink-2);font-size:13px}
.emb{width:38px;height:38px;display:grid;place-items:center;font-size:21px;border:3px solid var(--edge);flex:none}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.how div{background:var(--well);border:3px solid var(--edge);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px}
.how b{font-family:var(--display);font-size:21px;font-weight:400;color:var(--gold)}
.how .em{font-size:38px}
kbd{background:#59616F;border:2px solid var(--edge);border-bottom-width:4px;border-radius:4px;padding:0 6px;font-family:var(--body);font-weight:900;font-size:.9em}
.trade{width:min(880px,100%)}
.th{display:flex;gap:14px;align-items:center}
.th .emb{width:60px;height:60px;font-size:32px}
.th h2{font-size:28px;color:var(--ink)}
.say2{background:var(--well);border:3px solid var(--edge);border-radius:4px;padding:10px 14px;font-size:18px}
.step{font-family:var(--display);font-size:21px;color:var(--gold)}
.items{display:flex;flex-wrap:wrap;gap:10px}
.it{position:relative;min-width:108px;background:var(--well);border:3px solid var(--edge);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:900}
.it img{width:44px;height:44px}
.it small{font-size:13px;color:var(--ink-2);font-weight:700}
.it[aria-pressed="true"]{border-color:var(--gold);background:#3A3214}
.it .badge{position:absolute;top:-10px;right:-8px;background:var(--gold);color:var(--gold-ink);border:2px solid var(--edge);border-radius:4px;padding:0 6px;font-size:13px}
.it .badge.cheap{background:var(--good);color:#0E2A08}
.it:disabled{opacity:.4}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;padding:0}
.stepper b{min-width:26px;text-align:center;font-size:20px}
.tmsg{font-size:18px;font-weight:900;padding:9px 13px;border-radius:4px;background:var(--well);border:3px solid var(--edge)}
.tmsg.good{color:var(--good)}.tmsg.bad{color:var(--bad)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.box{background:var(--well);border:3px solid var(--edge);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rtable{width:100%;border-collapse:collapse;font-size:16px}
.rtable td,.rtable th{padding:6px 8px;border-top:2px solid #2B313B;text-align:left;white-space:nowrap}
.rtable th{color:var(--ink-2);font-size:13px;border-top:none}
.rtable tr.me td{color:var(--gold);font-weight:900}
.rtable td.n{text-align:right;font-variant-numeric:tabular-nums}
.result{display:flex;gap:18px;align-items:center;background:var(--well);border:3px solid var(--gold);border-radius:4px;padding:14px}
.result .score{font-family:var(--display);font-size:60px;color:var(--gold);line-height:1}
.pin{display:flex;gap:10px;justify-content:center}
.pin input{width:64px;height:76px;text-align:center;font-size:36px;font-weight:900}
/* teacher console */
#tpanel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);display:flex;flex-direction:column;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#tpanel .thead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:3px solid var(--edge)}
#tpanel .tbody{overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
#tpanel h3{font-size:20px;color:var(--gold)}
.slist{width:100%;border-collapse:collapse;font-size:14px}
.slist td,.slist th{padding:5px 4px;border-top:2px solid #2B313B;text-align:left;white-space:nowrap}
.slist th{color:var(--ink-2);font-size:12px;border-top:none}
.slist td.n{text-align:right;font-variant-numeric:tabular-nums}
.slist .acts{display:flex;gap:4px}
.slist .acts button{padding:2px 6px;font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:900;background:#2B313B}
.pill.on{background:var(--good);color:#0E2A08}.pill.off{background:#4A2A2A;color:#FFC9C0}
.tlog{max-height:160px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:14px;-webkit-user-select:text;user-select:text}
.nogl{max-width:520px;padding:24px;text-align:center}
#spot{position:fixed;border-radius:10px;box-shadow:0 0 0 4px var(--gold),0 0 0 9999px rgba(4,10,15,.45);pointer-events:none;z-index:40;transition:all .2s}
#coach{position:fixed;z-index:41;width:min(400px,calc(100vw - 24px));padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-color:var(--gold);pointer-events:none}
#coach button{pointer-events:auto}
#coach .who{display:flex;gap:10px;align-items:flex-start}#coach .who span{font-size:38px;line-height:1}
#coach p{font-size:20px;line-height:1.5}#coach .stp{font-size:13px;color:var(--gold);font-weight:900}
#coach .row{justify-content:flex-end}
.garrow{font-size:40px;line-height:1;color:var(--gold);text-shadow:0 0 6px #000,2px 2px 0 #3A2600;animation:bob .8s ease-in-out infinite}
.tag.guide b{border-color:var(--gold);color:var(--gold)}
#mission .hint{font-size:16px;font-weight:900;color:var(--gold);background:#2A2410;border:2px solid #6B5512;border-radius:4px;padding:5px 8px}
.book{width:min(880px,100%)}
.page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:center;min-height:300px}
.art{background:var(--well);border:3px solid var(--edge);border-radius:6px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.art .huge{font-size:84px;line-height:1}
.art .blk{width:74px;height:74px;display:grid;place-items:center;background:#B48B53;border:4px solid #FFD34E;box-shadow:inset 0 0 0 4px #7A5A30;font-size:40px}
.art .rowa{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:22px;font-weight:900}
.pt{display:flex;flex-direction:column;gap:12px}
.pt h2{font-size:clamp(28px,3.4vw,40px)}
.pt li{font-size:21px;margin:4px 0}
.pt ul{margin:0;padding-left:24px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:19px;align-items:center}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:12px;height:12px;border-radius:50%;background:#3A414E;border:2px solid var(--edge)}.dots i.on{background:var(--gold)}
@media (max-width:900px){.page{grid-template-columns:1fr}.art{min-height:180px}.art .huge{font-size:60px}}
@media (max-width:900px){
  .ngrid,.how{grid-template-columns:repeat(2,minmax(0,1fr))}.choices{grid-template-columns:1fr}.split{grid-template-columns:1fr}
  #mission{width:min(240px,calc(100vw - 200px));padding:7px 9px}#mission .why{display:none}
  #mini{width:112px;height:112px}#rank{width:112px;font-size:12px}#rank li span:nth-child(3){max-width:44px}
  #day{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .slot{width:46px;height:46px}.slot img{width:28px;height:28px}
  #chat{width:min(220px,40vw)}#chatlog{max-height:100px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="view" aria-label="블록으로 만든 섬 세계. 화살표나 WASD로 걷고, 화면을 끌어서 둘러봐요."></canvas>
<div id="hurt"></div>
<canvas id="tagcv" aria-hidden="true"></canvas>
<div id="hud" hidden>
  <div id="mission" class="pane"></div>
  <div id="day" class="pane"></div>
  <div id="notice" class="pane" hidden></div>
  <div id="side"><canvas id="mini" width="160" height="160" aria-label="미니맵"></canvas><div id="rank" class="pane"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <button id="prompt" class="btn gold" hidden></button>
  <div id="offer" class="pane" hidden></div>
  <div id="bottom"><div id="hearts" aria-label="체력"></div><div id="hotbar" class="pane"></div></div>
  <div id="chat"><div id="chatlog" aria-live="polite"></div><form id="chatform"><input id="chatin" class="field" maxlength="40" placeholder="채팅 (Enter)" autocomplete="off"><button class="btn small" type="submit">보내기</button></form></div>
  <div id="tools"><button id="homeBtn" class="btn" title="우리 집으로 돌아가기" aria-label="우리 집으로">🏠</button><button id="guideBtn" class="btn" title="길 안내 켜기/끄기" aria-label="길 안내">🧭</button><button id="mineBtn" class="btn" title="캐기·공격 (F 또는 클릭)" aria-label="캐기 또는 공격">⛏️</button><button id="helpBtn" class="btn" aria-label="게임 방법">❓</button></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="tbtn" hidden><button id="jumpBtn" class="btn" aria-label="점프">⤒</button><button id="talkBtn" class="btn gold" aria-label="대화">💬</button></div>
</div>

<div id="screen"></div>
<div id="spot" hidden></div>
<div id="coach" class="pane" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ===== 반 코드: 반마다 게임을 완전히 따로 ===== */
(function(){
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
  function h(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function norm(c){c=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return /^[A-Z0-9]{4,8}$/.test(c)?c:''}
  var q=new URLSearchParams(location.search),fromUrl=norm(q.get('c')||q.get('반'));
  var code=fromUrl||norm(ls('btw-class'));if(fromUrl)ls('btw-class',fromUrl);
  var ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function base(){return location.origin+location.pathname}
  function go(c){location.href=base()+(c?'?c='+c:'')}
  async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  var CLS=window.CLS={code:code,meta:null,fdb:null,
    ready:function(fdb){CLS.fdb=fdb;if(!code)return;
      fdb.ref('btw/classes/'+code).get().then(function(s){if(!s.exists()){ls('btw-class',null);ls('btw-class-err',code);go('');return}
        CLS.meta=s.val();if(typeof ST!=='undefined'&&ST==='title')showTitle();if(typeof MODE!=='undefined'&&MODE==='teacher')renderTeacher()}).catch(function(e){console.error(e)})},
    name:function(){return CLS.meta?CLS.meta.name:'불러오는 중…'},
    link:function(){return base()+'?c='+code},
    banner:function(){return '<div class="row" style="background:rgba(255,215,90,.14);border:2px solid rgba(255,215,90,.5);border-radius:12px;padding:8px 12px;margin:6px 0"><span style="font-size:22px">🏫</span><b style="font-size:20px">'+h(CLS.name())+'</b><span class="pill">반 코드 <b>'+code+'</b></span><button class="btn small" id="clsChange" style="margin-left:auto">다른 반으로 바꾸기</button></div>'},
    teacherBox:function(){return '<div class="box"><h3>🏫 '+h(CLS.name())+' · 반 코드 <span style="font-size:26px;letter-spacing:3px;color:var(--gold,#e6b800)">'+code+'</span></h3><p class="muted" style="font-size:14px">학생들에게 아래 주소를 알려 주거나, 처음 화면에서 반 코드 <b>'+code+'</b> 를 입력하게 해요. 다른 반과 절대 섞이지 않아요.</p><div class="row"><input class="field" readonly value="'+h(CLS.link())+'" style="flex:1;min-width:200px" onclick="this.select()"><button class="btn small" id="clsCopy">주소 복사</button></div></div>'},
    checkPin:async function(pin){if(!CLS.meta&&CLS.fdb){var s=await CLS.fdb.ref('btw/classes/'+code).get();CLS.meta=s.val()}return !!CLS.meta&&(await sha(code+':'+pin))===CLS.meta.pin},
    picker:function(mode,msg){var sc=document.getElementById('screen');ST='class';
      var err=ls('btw-class-err');if(err&&!msg){msg='반 코드 '+err+' 는 없는 코드예요. 다시 확인해 주세요.';ls('btw-class-err',null)}
      if(mode==='new'){sc.innerHTML='<div class="card pane" style="width:min(560px,100%)"><p class="eyebrow">선생님 · 새 반 만들기</p><h2>우리 반을 만들어요</h2><p class="muted">반을 만들면 겹치지 않는 <b>반 코드</b>가 생겨요. 이 반의 게임·채팅·결과는 다른 반과 완전히 따로 저장돼요.</p>'
        +'<label style="display:flex;flex-direction:column;gap:4px;margin:8px 0"><b>반 이름</b><input id="clsName" class="field" maxlength="20" placeholder="예: ○○초 6학년 3반"></label>'
        +'<div class="row"><label style="display:flex;flex-direction:column;gap:4px"><b>선생님 PIN (숫자 4자리)</b><input id="clsPin" class="field" type="password" inputmode="numeric" maxlength="4" style="width:150px"></label><label style="display:flex;flex-direction:column;gap:4px"><b>PIN 한 번 더</b><input id="clsPin2" class="field" type="password" inputmode="numeric" maxlength="4" style="width:150px"></label></div>'
        +'<p class="muted" style="font-size:14px">PIN은 이 반의 선생님 관리자 화면에 들어갈 때 써요. 잊지 않게 적어 두세요.</p><p id="clsMsg" class="muted"> </p>'
        +'<div class="row"><button class="btn" id="clsBack">← 뒤로</button><button class="btn gold" id="clsMake">🏫 반 만들기</button></div></div>';
      }else if(mode==='made'){sc.innerHTML='<div class="card pane" style="width:min(600px,100%);text-align:center"><p class="eyebrow">반이 만들어졌어요</p><h2>'+h(msg.name)+'</h2><p class="big">우리 반 코드</p><p style="font-size:64px;font-weight:900;letter-spacing:8px;margin:4px 0;color:var(--gold,#e6b800)">'+msg.code+'</p>'
        +'<p class="muted">학생 입장 주소</p><div class="row" style="justify-content:center"><input class="field" readonly value="'+h(base()+'?c='+msg.code)+'" style="flex:1;min-width:220px" onclick="this.select()"><button class="btn small" id="clsCopy2">주소 복사</button></div>'
        +'<p class="muted" style="font-size:14px">이 코드와 PIN을 적어 두세요. 선생님 관리자 화면에서도 언제든 다시 볼 수 있어요.</p><div class="row" style="justify-content:center"><button class="btn gold" id="clsEnter">이 반으로 들어가기 →</button></div></div>';
      }else{sc.innerHTML='<div class="card pane" style="width:min(600px,100%)"><p class="eyebrow">6학년 사회 · 세계 여러 나라와 무역</p><h1>블록 무역 월드</h1><h2 style="margin-top:6px">우리 반 코드를 입력해요</h2><p class="muted">선생님이 알려 준 코드를 적어요. (예: K7Q2M)</p>'
        +'<form id="clsForm" class="row"><input id="clsCode" class="field" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="반 코드" style="font-size:28px;letter-spacing:4px;text-transform:uppercase;width:220px;text-align:center"><button class="btn gold" type="submit">들어가기</button></form><p id="clsMsg" class="muted">'+(msg?'<span style="color:var(--bad)">'+h(msg)+'</span>':' ')+'</p>'
        +'<div class="choices"><button class="choice" id="clsNew" type="button"><span class="em">🧑‍🏫</span><b>새 반 만들기</b><span class="muted">선생님이 처음 한 번 만들어요</span></button><button class="choice" data-act="sSolo" type="button"><span class="em">🧭</span><b>혼자 연습하기</b><span class="muted">반 코드 없이 연습해요</span></button></div></div>'}
      sc.hidden=false;
      var $=function(id){return document.getElementById(id)},m=function(t,bad){var e=$('clsMsg');if(e){e.textContent=t;e.style.color=bad?'var(--bad)':''}};
      if($('clsForm')){$('clsCode').focus();$('clsForm').onsubmit=async function(e){e.preventDefault();e.stopPropagation();var c=norm($('clsCode').value);if(!c){m('반 코드는 영어와 숫자 4~8자예요.',1);return}
        m('확인하는 중…');try{var s=await CLS.fdb.ref('btw/classes/'+c).get();if(!s.exists()){m('없는 반 코드예요. 다시 확인해 주세요.',1);return}ls('btw-class',c);go(c)}catch(er){m('연결이 안 돼요. 인터넷을 확인해 주세요.',1)}};
        $('clsNew').onclick=function(){CLS.picker('new')}}
      if($('clsMake')){$('clsName').focus();$('clsBack').onclick=function(){CLS.picker()};$('clsMake').onclick=async function(){var nm=$('clsName').value.trim().slice(0,20),p1=$('clsPin').value,p2=$('clsPin2').value;
        if(!nm){m('반 이름을 적어 주세요.',1);return}if(!/^\d{4}$/.test(p1)){m('PIN은 숫자 4자리예요.',1);return}if(p1!==p2){m('두 PIN이 달라요.',1);return}
        this.disabled=true;m('반을 만드는 중…');
        for(var i=0;i<6;i++){var c='';for(var j=0;j<5;j++)c+=ABC[Math.floor(Math.random()*ABC.length)];
          try{var ex=await CLS.fdb.ref('btw/classes/'+c).get();if(ex.exists())continue;await CLS.fdb.ref('btw/classes/'+c).set({name:nm,pin:await sha(c+':'+p1),at:Date.now()});ls('btw-class',c);CLS.picker('made',{code:c,name:nm});return}catch(er){console.error(er)}}
        this.disabled=false;m('반을 만들지 못했어요. 잠시 뒤 다시 해 주세요.',1)}}
      if($('clsEnter'))$('clsEnter').onclick=function(){go(ls('btw-class'))};
      ['clsCopy2'].forEach(function(id){if($(id))$(id).onclick=function(){copy(this.previousSibling.value)}})},
  };
  function copy(t){try{navigator.clipboard.writeText(t);if(typeof toast==='function')toast('📋 주소를 복사했어요.','good')}catch(e){}}
  document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('#clsChange,#clsCopy');if(!t)return;
    if(t.id==='clsChange'){ls('btw-class',null);go('')}if(t.id==='clsCopy')copy(CLS.link())});
})();

/* ===== Firebase 연결 (실시간 함께하기) ===== */
(function(){
  var badge=null,bt=0;
  function say(t,keep){if(!badge){badge=document.createElement('div');badge.style.cssText='position:fixed;left:10px;top:10px;z-index:9999;background:rgba(20,24,32,.92);color:#fff;font:600 15px/1.3 system-ui,sans-serif;padding:8px 12px;border-radius:10px;pointer-events:none;max-width:80vw';(document.body||document.documentElement).appendChild(badge)}
    badge.textContent=t;badge.style.display='block';clearTimeout(bt);if(!keep)bt=setTimeout(function(){badge.style.display='none'},4000)}
  var cfg=(typeof firebaseConfig!=='undefined')?firebaseConfig:null;
  if(!cfg||typeof cfg!=='object'||!cfg.apiKey||/여기|붙여|YOUR/i.test(String(cfg.apiKey))){window.FB_OFF='cfg';return}
  if(typeof firebase==='undefined'||!firebase.initializeApp||!firebase.database){window.FB_OFF='sdk';return}
  if(!cfg.databaseURL&&cfg.projectId)cfg.databaseURL='https://'+cfg.projectId+'-default-rtdb.firebaseio.com';
  var fdb;try{firebase.initializeApp(cfg);fdb=firebase.database()}catch(e){console.error(e);window.FB_OFF='init';return}
  var CODE=(window.CLS&&CLS.code)||'_none';
  var ROOT='btw/c/'+CODE+'/',MIN_GAP=200,everOn=false,ruleWarned=false,reconnectHooks=[];
  function clean(o){return o===undefined?null:JSON.parse(JSON.stringify(o))}
  function denied(e){console.error(e);if(ruleWarned)return;ruleWarned=true;
    var again=false;try{again=sessionStorage.getItem('btw-reloaded')==='1'}catch(x){}
    if(!again){try{sessionStorage.setItem('btw-reloaded','1')}catch(x){}say('🔄 새 버전으로 바꾸는 중이에요…',true);setTimeout(function(){location.reload()},1200);return}
    say('🔴 서버가 저장을 막았어요. 새로고침(F5)을 눌러 주세요. 계속되면 반 코드를 다시 확인해 주세요.',true)}
  setTimeout(function(){try{sessionStorage.removeItem('btw-reloaded')}catch(x){}},20000);
  fdb.ref('.info/connected').on('value',function(s){
    if(s.val()===true){if(everOn)say('🟢 다시 연결됐어요');else say('🟢 실시간 서버에 연결됐어요');everOn=true;reconnectHooks.forEach(function(f){try{f()}catch(e){}})}
    else if(everOn)say('🔴 연결이 끊겼어요. 인터넷을 확인하는 중…',true)});
  setTimeout(function(){if(!everOn)say('🔴 실시간 서버에 연결하지 못했어요. firebase-config.js 를 확인해 주세요.',true)},9000);

  var db={doc:function(path){var ref=fdb.ref(ROOT+path);return{
    set:function(v){return ref.set(clean(v)).catch(function(e){denied(e);throw e})},
    onSnapshot:function(cb,err){var h=function(s){cb({exists:s.exists(),data:function(){return s.val()}})};
      ref.on('value',h,function(e){denied(e);if(err)err(e)});return function(){ref.off('value',h)}}}}};

  function shortPos(p){return typeof p==='string'?p.split(',').map(function(n,i){return i<4?(+n).toFixed(i===1?2:1).replace(/\.?0+$/,''):n}).join(','):p}
  var room={join:function(name){
    var id='p'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
    var rref=fdb.ref(ROOT+'rooms/'+String(name).replace(/[.#$\[\]\/]/g,'_')),mine=rref.child(id);
    var peers={},cbs=[],last={},pending=null,timer=0,lastW=0,left=false,emitT=0;
    mine.onDisconnect().remove();
    function emit(){emitT=0;if(left)return;var ch={peers:Object.keys(peers).map(function(k){return{peer:k,sameTab:k===id,kind:'viewer',presence:peers[k]}})};
      cbs.forEach(function(f){try{f(ch)}catch(e){console.error(e)}})}
    function soon(){if(!emitT)emitT=setTimeout(emit,90)}
    function put(s){peers[s.key]=s.val()||{};soon()}
    function del(s){delete peers[s.key];soon()}
    rref.on('child_added',put,denied);rref.on('child_changed',put);rref.on('child_removed',del);
    function hook(){if(left)return;mine.onDisconnect().remove();last={};if(!pending&&peers[id])pending=peers[id];if(pending)flush()}
    reconnectHooks.push(hook);
    function flush(){timer=0;if(left||!pending)return;var v=pending;pending=null;lastW=Date.now();
      var patch={},n=0,first=!Object.keys(last).length;
      Object.keys(v).forEach(function(k){if(JSON.stringify(v[k])!==JSON.stringify(last[k])){patch[k]=v[k]==null?null:v[k];n++}});
      Object.keys(last).forEach(function(k){if(!(k in v)){patch[k]=null;n++}});
      last=v;if(!n)return;(first?mine.set(v):mine.update(patch)).catch(denied)}
    var rr={
      presence:function(v){if(left)return Promise.resolve();v=clean(v)||{};if(v.p)v.p=shortPos(v.p);pending=v;
        var wait=MIN_GAP-(Date.now()-lastW);if(wait<=0)flush();else if(!timer)timer=setTimeout(flush,wait);return Promise.resolve()},
      onPeers:function(cb){cbs.push(cb);soon();return function(){cbs=cbs.filter(function(f){return f!==cb})}},
      leave:function(){left=true;clearTimeout(timer);rref.off();reconnectHooks=reconnectHooks.filter(function(f){return f!==hook});
        mine.onDisconnect().cancel();return mine.remove().catch(function(){})}};
    return Promise.resolve(rr)}};
  var user={canEdit:function(){return Promise.resolve(true)}};
  window.claude={use:function(n){return Promise.resolve(n==='db'?db:n==='room'?room:n==='user'?user:null)}};
  window.FB_ON=true;window.FDB=fdb;if(window.CLS)CLS.ready(fdb);
})();

const H=28,SEA=3,CH=16;

const IX=(x,y,z)=>(y*N+z)*N+x;

function layout(n){if(n<=8)return{N:80,ISL:37,rings:[[n,24]]};if(n<=14)return{N:96,ISL:45,rings:[[n,31]]};const a=Math.ceil(n*.36);if(n<=20)return{N:128,ISL:61,rings:[[a,24],[n-a,47]]};const b=Math.ceil((n-7)*.4);return{N:144,ISL:69,rings:[[7,21],[b,38],[n-7-b,56]]}}

function rawH(x,z){let ws=0,amp=0;for(let i=0;i<VIL.length;i++){const v=VIL[i],w=Math.exp(-Math.hypot(x-v.x,z-v.z)/6);ws+=w;amp+=w*AMP[NATS[i].biome]}amp/=ws;

function genWorld(ids,seed){
  R=mulberry(seed);NATS=makeNats(ids);const L=layout(ids.length);N=L.N;ISL=L.ISL;CX=CZ=N/2;
  occ=new Uint8Array(N*H*N);topH=new Int16Array(N*N);biomeOf=new Int8Array(N*N);reserved=new Uint8Array(N*N);VIL=[];
  L.rings.forEach(([cnt,r],ri)=>{for(let k=0;k<cnt;k++){const a=(-90+(k+(ri?.5:0))*360/cnt)*Math.PI/180;VIL.push({x:Math.round(CX+r*Math.cos(a)),z:Math.round(CZ+r*Math.sin(a)),h:0})}});

  for(let z=0;z<N;z++)for(let x=0;x<N;x++){const h=topH[x+z*N],bm=NATS[biomeOf[x+z*N]].biome;let beach=h<=SEA;
    if(!beach&&h<=SEA+1)for(let dz=-2;dz<=2&&!beach;dz++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,zz=z+dz;if(xx>=0&&zz>=0&&xx<N&&zz<N&&topH[xx+zz*N]<SEA){beach=true;break}}
    let top=B.GRASS,sub=B.DIRT;if(beach||bm==='desert'){top=B.SAND;sub=B.SAND}else if(bm==='outback'){top=B.RED;sub=B.RED}else if(bm==='snow')top=B.SNOW;else if(bm==='mountain'&&h>=12){top=B.STONE;sub=B.STONE}
    for(let y=0;y<h;y++)put(x,y,z,y===h-1?top:y>=h-3?sub:B.STONE)}
  for(let z=CZ-6;z<=CZ+6;z++)for(let x=CX-6;x<=CX+6;x++){const d=Math.hypot(x-CX,z-CZ);if(d<=6.2){reserved[x+z*N]=1;if(d<=4.6)put(x,topH[x+z*N]-1,z,d>3.8?B.COBBLE:B.PATH)}}
  const ph=topH[CX+CZ*N];for(const[dx,dz]of[[-2,-2],[2,-2],[-2,2],[2,2]])for(let y=0;y<3;y++)put(CX+dx,ph+y,CZ+dz,B.LOG);
  for(let dz=-3;dz<=3;dz++)for(let dx=-3;dx<=3;dx++)put(CX+dx,ph+3,CZ+dz,Math.abs(dx)+Math.abs(dz)<=4?B.WOOL+((dx+dz+40)%NATS.length):B.PLANK);
  VIL.forEach(v=>{const Lg=Math.hypot(CX-v.x,CZ-v.z);for(let t=0;t<=Lg;t+=.3){const fx=v.x+(CX-v.x)*t/Lg,fz=v.z+(CZ-v.z)*t/Lg;for(const[ox,oz]of[[0,0],[1,0],[0,1]]){const x=Math.floor(fx)+ox,z=Math.floor(fz)+oz;if(x<0||z<0||x>=N||z>=N)continue;const h=topH[x+z*N];if(h<SEA)continue;reserved[x+z*N]=1;put(x,h-1,z,B.PATH)}}});

    if(VIL.some(v=>Math.hypot(x-v.x,z-v.z)<8)||Math.hypot(x-CX,z-CZ)<8)continue;

    else if(bm==='jungle'&&r<.045)jungle(x,h,z);else if(bm==='snow'&&r<.04)spruce(x,h,z);else if(bm==='bamboo'&&r<.06)bamboo(x,h,z);
    else if(bm==='desert'&&r<.02)cactus(x,h,z);else if(bm==='outback'&&r<.02)put(x,h,z,B.DRY);else if(bm==='outback'&&r<.026)oak(x,h,z,B.DRY)}
  RES=NATS.map(()=>[]);
  NATS.forEach((n,i)=>{const v=VIL[i];n.prod.forEach(p=>{let tries=0,c=0;while(c<8&&tries<400){tries++;const a=R()*Math.PI*2,d=4+R()*8,x=Math.round(v.x+Math.cos(a)*d),z=Math.round(v.z+Math.sin(a)*d);
    if(x<1||z<1||x>=N-1||z>=N-1)continue;const k=x+z*N;if(reserved[k]||biomeOf[k]!==i||topH[k]<SEA+1)continue;const y=topH[k];if(get(x,y,z)||get(x,y+1,z))continue;put(x,y,z,B.RES+IT.indexOf(p));RES[i].push([x,y,z,p]);c++}})})}
function clearAt(x,y,z){return get(x,y,z)===0}
function leaf(x,y,z,t){if(clearAt(x,y,z))put(x,y,z,t)}
function oak(x,h,z,L){const th=4+(R()<.5?1:0);for(let y=0;y<th;y++)put(x,h+y,z,B.LOG);for(let y=th-2;y<=th+1;y++){const r=y>=th?1:2;for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){if(r===2&&Math.abs(dx)===2&&Math.abs(dz)===2&&R()<.6)continue;leaf(x+dx,h+y,z+dz,L)}}}
function jungle(x,h,z){const th=6+(R()*2|0);for(let y=0;y<th;y++)put(x,h+y,z,B.LOG);for(let y=th-2;y<=th;y++){const r=y===th?1:y===th-1?3:2;for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){if(Math.abs(dx)+Math.abs(dz)>r+1)continue;leaf(x+dx,h+y,z+dz,B.JLEAF)}}}
function spruce(x,h,z){for(let y=0;y<5;y++)put(x,h+y,z,B.LOG);[2,2,1,1,0].forEach((r,i)=>{const y=h+1+i+(i>2?1:0);for(let dz=-r;dz<=r;dz++)for(let dx=-r;dx<=r;dx++){if(Math.abs(dx)+Math.abs(dz)>r+(r>1?1:0))continue;leaf(x+dx,y,z+dz,B.SPRUCE)}});leaf(x,h+6,z,B.SPRUCE)}
function bamboo(x,h,z){const th=3+(R()*3|0);for(let y=0;y<th;y++)put(x,h+y,z,B.BAMBOO);leaf(x,h+th,z,B.JLEAF)}
function cactus(x,h,z){const th=2+(R()<.5?1:0);for(let y=0;y<th;y++)put(x,h+y,z,B.CACTUS)}
function buildVillage(v,i){const dx=CX-v.x,dz=CZ-v.z;let ax,az;if(Math.abs(dx)>Math.abs(dz)){ax=-Math.sign(dx);az=0}else{ax=0;az=-Math.sign(dz)}
  const hx=v.x+ax*4,hz=v.z+az*4,y0=v.h;
  for(let z=-6;z<=6;z++)for(let x=-6;x<=6;x++){const X=v.x+x,Z=v.z+z;if(X>=0&&Z>=0&&X<N&&Z<N)reserved[X+Z*N]=1}
  for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++){const X=hx+x,Z=hz+z;put(X,y0-1,Z,B.PLANK);if(!(Math.abs(x)===2||Math.abs(z)===2))continue;
    for(let y=0;y<3;y++){const front=(ax!==0?x===-2*ax:z===-2*az),mid=(ax!==0?z===0:x===0);if(front&&mid&&y<2)continue;const side=(ax!==0?Math.abs(z)===2:Math.abs(x)===2),smid=(ax!==0?x===0:z===0);if(side&&smid&&y===1)continue;put(X,y0+y,Z,(Math.abs(x)===2&&Math.abs(z)===2)?B.LOG:B.PLANK)}}
  [[3,0],[2,1],[1,2],[0,3]].forEach(([r,dy])=>{for(let x=-r;x<=r;x++)for(let z=-r;z<=r;z++)put(hx+x,y0+3+dy,hz+z,B.WOOL+i)});
  {const pxd=az!==0?1:0,pzd=ax!==0?1:0;const bx=hx+ax-pxd,bz=hz+az-pzd,cx2=hx+ax+pxd,cz2=hz+az+pzd;put(bx,y0,bz,B.BED);put(cx2,y0,cz2,B.CHEST);v.bed={x:bx+.5,y:y0,z:bz+.5};v.chest={x:cx2+.5,y:y0,z:cz2+.5};v.hc={x:hx,z:hz,y:y0}}
  const px=v.x+(az!==0?2:0),pz=v.z+(ax!==0?2:0);for(let y=0;y<5;y++)put(px,y0+y,pz,B.LOG);
  v.flag={x:px+.5,y:y0+4.5,z:pz+.5,ax:az!==0?1:0};v.house={x:hx+.5,y:y0+7,z:hz+.5};v.face=Math.atan2(-ax,-az);v.door={x:v.x+.5,z:v.z+.5};v.ax=ax;v.az=az}

const atlas=document.createElement('canvas');atlas.width=256;atlas.height=256;const ag=atlas.getContext('2d');

function tile(i,fn){ag.save();ag.translate((i%16)*16,(i/16|0)*16);ag.clearRect(0,0,16,16);ag.beginPath();ag.rect(0,0,16,16);ag.clip();fn(ag);ag.restore()}
const pxl=(g,x,y,c)=>{g.fillStyle=c;g.fillRect(x,y,1,1)};

const DIRT=['#7A5332',['#6A4529','#8C6340','#5E3D24','#94704A'],110];

function raycast(){const ox=player.x,oy=player.y+1.5,oz=player.z;let[dx,dy,dz]=camDir;const l=Math.hypot(dx,dy,dz)||1;dx/=l;dy/=l;dz/=l;
  let x=Math.floor(ox),y=Math.floor(oy),z=Math.floor(oz);const sx=Math.sign(dx),sy=Math.sign(dy),sz=Math.sign(dz);
  const tdx=Math.abs(1/dx),tdy=Math.abs(1/dy),tdz=Math.abs(1/dz);let tx=(sx>0?x+1-ox:ox-x)*tdx,ty=(sy>0?y+1-oy:oy-y)*tdy,tz=(sz>0?z+1-oz:oz-z)*tdz;
  for(let i=0;i<20;i++){if(Math.min(tx,ty,tz)>4.5)return null;if(tx<ty&&tx<tz){x+=sx;tx+=tdx}else if(ty<tz){y+=sy;ty+=tdy}else{z+=sz;tz+=tdz}
    const t=get(x,y,z);if(t&&!isLeafT(t)||t>=8&&t<=11)return{x,y,z,t}}return null}
let target=null;
function nearRes(){const fx=Math.sin(player.yaw),fz=Math.cos(player.yaw);let best=null,bd=9;const px=Math.floor(player.x),pz=Math.floor(player.z),py=Math.floor(player.y);
  for(let dz=-3;dz<=3;dz++)for(let dx=-3;dx<=3;dx++)for(let dy=-1;dy<=2;dy++){const x=px+dx,y=py+dy,z=pz+dz,t=get(x,y,z);if(t<B.RES)continue;const vx=x+.5-player.x,vz=z+.5-player.z,d=Math.hypot(vx,vz);if(d>2.6)continue;if(d>.6&&(vx*fx+vz*fz)/d<.2)continue;if(d<bd){bd=d;best={x,y,z,t}}}return best}

  const fx=Math.sin(player.yaw),fz=Math.cos(player.yaw);
  const zb=zombies.find(zm=>{const dx=zm.x-player.x,dz=zm.z-player.z,d=Math.hypot(dx,dz);return d<2.8&&(dx*fx+dz*fz)/d>.35&&Math.abs(zm.y-player.y)<2});
  if(zb){zb.hp--;zb.flash=.2;zb.vx=fx*7;zb.vz=fz*7;zb.vy=4;if(zb.hp<=0){zombies.splice(zombies.indexOf(zb),1);toast('💥 좀비를 물리쳤어요!','good');if(R()<.4){const pool=itemPool(),p=pool[R()*pool.length|0];if(p){G.inv[p]=(G.inv[p]||0)+1;toast(`좀비가 ${ITEMS[p][1]} ${ITEMS[p][0]}을(를) 떨어뜨렸어요!`,'gold');renderHUD()}}}return}
  if(!target)return;const{x,y,z,t}=target;const k=x+','+y+','+z;
  if(y<=1){toast('너무 깊어서 캘 수 없어요.','bad');return}
  if(t===B.BED||t===B.CHEST||t<B.RES&&reserved[x+z*N]&&(t===B.PLANK||t===B.LOG||t>=B.WOOL||t===B.PATH||t===B.COBBLE)){toast('마을 건물과 길은 캘 수 없어요.','bad');return}
  if(t>=B.RES&&biomeOf[x+z*N]!==G.slot){toast(`${NATS[biomeOf[x+z*N]].name} 땅의 자원이에요. 무역으로 구해요!`,'bad');return}
  G.hits[k]=(G.hits[k]||0)+1;if(G.hits[k]<hardness(t))return;delete G.hits[k];

function houseAt(x,y,z){const X=Math.floor(x),Z=Math.floor(z);for(let i=0;i<VIL.length;i++){const h=VIL[i].hc;if(h&&Math.abs(X-h.x)<=1&&Math.abs(Z-h.z)<=1&&y>=h.y-.2&&y<h.y+2.6)return i}return -1}

function updateZombies(dt){if(!zombiesOn()){zombies.length=0;return}
  const dusk=(elapsed()%G.dayLen)/G.dayLen>.6,want=quality==='low'?(dusk?3:2):(dusk?5:3);zSpawnT-=dt;
  if(zombies.length<want&&zSpawnT<=0){zSpawnT=3;for(let t=0;t<20;t++){const a=R()*Math.PI*2,d=14+R()*14,x=player.x+Math.cos(a)*d,z=player.z+Math.sin(a)*d,X=Math.floor(x),Z=Math.floor(z);if(X<2||Z<2||X>=N-2||Z>=N-2||topH[X+Z*N]<SEA+1||inSafe(x,z))continue;zombies.push({x,z,y:groundAt(x,z),vy:0,vx:0,vz:0,yaw:0,ph:R()*6,hp:3,cool:0,flash:0,ground:true});break}}
  for(let i=zombies.length-1;i>=0;i--){const zm=zombies[i];const dx=player.x-zm.x,dz=player.z-zm.z,d=Math.hypot(dx,dz);if(d>44){zombies.splice(i,1);continue}
    let mx=0,mz=0,sp=1.8;const chase=d<13&&!inSafe(player.x,player.z)&&ST!=='end';
    if(chase){mx=dx/d;mz=dz/d;sp=2.3}else{zm.wt=(zm.wt||0)-dt;if(zm.wt<=0){zm.wt=2+R()*3;zm.wa=R()*Math.PI*2}mx=Math.cos(zm.wa)*.6;mz=Math.sin(zm.wa)*.6}
    const nx=zm.x+mx*sp*dt,nz=zm.z+mz*sp*dt;if(inSafe(nx,nz)){mx=mz=0}else moveEnt(zm,mx*sp*dt+zm.vx*dt,mz*sp*dt+zm.vz*dt,dt);
    zm.vx*=.85;zm.vz*=.85;zm.flash=Math.max(0,zm.flash-dt);if(mx||mz){zm.yaw=Math.atan2(mx,mz);zm.ph+=dt*7}

  if(player.hp<=0){let best=null;Object.keys(G.inv).forEach(k=>{if(G.inv[k]>0&&(!best||G.inv[k]>G.inv[best]))best=k});let lost='';if(best){const n=Math.min(2,G.inv[best]);G.inv[best]-=n;lost=` ${ITEMS[best][1]} ${ITEMS[best][0]} ${n}개를 잃었어요.`}
    player.hp=10;homeSpawn();zombies.length=0;toast(`😵 좀비에게 쓰러졌어요! 우리 마을로 돌아왔어요.${lost}`,'bad');}
  renderHearts();renderHUD()}
let regenT=0;function regen(dt){regenT+=dt;const need=inSafe(player.x,player.z)?3:12;if(regenT>=need){regenT=0;if(player.hp<10){player.hp++;renderHearts()}}}

/* ====================== PHYSICS ====================== */
function solid(x,y,z){if(y<0)return true;if(x<0||z<0||x>=N||z>=N)return true;if(y>=H)return false;return occ[IX(x,y,z)]!==0}
function water(x,z){return x<0||z<0||x>=N||z>=N||topH[x+z*N]<SEA}
function hits(px,py,pz){const r=.28;for(const[dx,dz]of[[-r,-r],[r,-r],[-r,r],[r,r]]){const X=Math.floor(px+dx),Z=Math.floor(pz+dz);if(water(X,Z))return true;for(const dy of[.05,.9,1.7])if(solid(X,Math.floor(py+dy),Z))return true}return false}
function groundAt(x,z){const X=Math.floor(x),Z=Math.floor(z);for(let y=H-1;y>=0;y--)if(solid(X,y,Z))return y+1;return SEA}
function moveEnt(e,mx,mz,dt){
  const nx=e.x+mx;if(!hits(nx,e.y,e.z))e.x=nx;else if(e.ground&&!hits(nx,e.y+1.02,e.z)){e.y+=1.02;e.x=nx}

   <div class="row"><button class="btn gold" style="font-size:19px" data-act="psend" ${any?'':'disabled'}>📨 제안 보내기</button><span class="muted">서로 원하는 물건을 바꾸면 둘 다 +1점!</span></div></div>`;$('#screen').hidden=false}
function sendOffer(){const g={},w={};Object.entries(ptrade.give).forEach(([k,v])=>{if(v>0)g[k]=v});Object.entries(ptrade.get).forEach(([k,v])=>{if(v>0)w[k]=v});
  for(const[k,v]of Object.entries(g))if((G.inv[k]||0)<v)return;Object.entries(g).forEach(([k,v])=>G.inv[k]-=v);
  myOffer={id:Date.now()%1e9,to:ptrade.peer,g,w,at:Date.now()};sendPresence(true);toast('📨 제안을 보냈어요. 친구의 대답을 기다려요.','blue');closeTrade();renderHUD()}
function checkOffers(){if(!G||MODE!=='multi')return;
  if(myOffer){const o=others.get(myOffer.to);const a=o&&o.ans;if(a&&a.id===myOffer.id){if(a.ok){Object.entries(myOffer.w).forEach(([k,v])=>G.inv[k]=(G.inv[k]||0)+v);G.trades++;toast(`🤝 ${o.name||'친구'}가 수락했어요! 무역 성공 (+1점)`,'good')}else{Object.entries(myOffer.g).forEach(([k,v])=>G.inv[k]=(G.inv[k]||0)+v);toast(`${o?o.name:'친구'}가 거절했어요. 물건을 돌려받았어요.`,'bad')}myOffer=null;sendPresence(true);renderHUD();updateTags();saveLocal()}

  if(!incoming)others.forEach((o,peer)=>{const of=o.offer;if(!of||of.to!==net.myPeer)return;const key=peer+':'+of.id;if(net.seenOffer.has(key))return;net.seenOffer.add(key);incoming={peer,...of};showOffer()})}

function sendPresence(force){if(MODE!=='multi'||!net.rr||!G)return;const now=Date.now();
  const pos=`${player.x.toFixed(2)},${player.y.toFixed(2)},${player.z.toFixed(2)},${player.yaw.toFixed(2)},${player.mv?1:0}`;
  if(!force&&(now-net.lastSend<90||pos===net.lastPos))return;net.lastSend=now;net.lastPos=pos;
  const inv={};Object.keys(G.inv).forEach(k=>{if(G.inv[k]>0)inv[k]=G.inv[k]});
  net.rr.presence({r:'s',no:G.no,nm:G.name.slice(0,12),s:G.slot,p:pos,hp:player.hp,sc:myScore(),m:G.mi,tr:G.trades,inv,chat:myChat,offer:myOffer?{id:myOffer.id,to:myOffer.to,g:myOffer.g,w:myOffer.w}:null,ans:myAns}).catch(()=>{})}
let myChat=null;
function onPeers(ch){const me0=ch.peers.find(p=>p.sameTab);if(me0)net.myPeer=me0.peer;
  const seen=new Set();ch.peers.forEach(p=>{if(p.sameTab||p.kind!=='viewer')return;const pr=p.presence||{};if(pr.r!=='s'||typeof pr.p!=='string')return;seen.add(p.peer);
    const[x,y,z,yw,mv]=pr.p.split(',').map(Number);let o=others.get(p.peer);if(!o){o={x,y,z,ph:0};others.set(p.peer,o)}
    Object.assign(o,{tx:x,ty:y,tz:z,tyaw:yw,mv:!!mv,slot:Number.isInteger(pr.s)&&pr.s>=0&&pr.s<NATS.length?pr.s:null,no:pr.no,name:String(pr.nm||'').slice(0,12),hp:pr.hp,sc:+pr.sc||0,m:+pr.m||0,tr:+pr.tr||0,inv:pr.inv&&typeof pr.inv==='object'?pr.inv:{},offer:pr.offer,ans:pr.ans});
    const c=pr.chat;if(c&&c.id&&net.seenChat.get(p.peer)!==c.id){net.seenChat.set(p.peer,c.id);if(net.seenChat.size>0&&typeof c.t==='string'){addChat(o.name||'?',c.t,p.peer,false);o.say=c.t;o.sayAt=Date.now()}}});
  [...others.keys()].forEach(k=>{if(!seen.has(k))others.delete(k)});
  throttle('tags',250,updateTags);if(G&&MODE==='multi'){throttle('rank',1000,renderRank);checkOffers()}if(MODE==='teacher')renderTeacherSoon()}
const _thr={};function throttle(k,ms,fn){const now=performance.now(),t=_thr[k]||(_thr[k]={last:0,timer:0});if(now-t.last>=ms){t.last=now;fn()}else if(!t.timer)t.timer=setTimeout(()=>{t.timer=0;t.last=performance.now();fn()},ms-(now-t.last))}
function addChat(name,text,peer,teacher){chatLog.push({name,text,peer,teacher,at:Date.now()});if(chatLog.length>60)chatLog.shift();renderChat();if(MODE==='teacher')renderTeacherSoon()}

  myChat={id:Date.now()%1e9,t:text};mySay=text;mySayAt=Date.now();addChat(G.name||'나',text,net.myPeer,false);sendPresence(true);updateTags();setTimeout(updateTags,7100)}
async function initNet(){try{net.db=await claude.use('db')}catch(e){}try{net.room=await claude.use('room')}catch(e){}try{net.user=await claude.use('user')}catch(e){}

  <div class="row"><span class="muted">화면 품질</span>${['low','normal','high'].map(k=>`<button class="btn small ${quality===k?'gold':''}" data-act="q" data-k="${k}">${QUAL[k].name}</button>`).join('')}</div>
  <div class="row"><button class="btn gold" style="margin-left:auto" data-act="resume">계속하기 ▶</button></div></div>`;$('#screen').hidden=false;placeCoach()}
function showEnd(){const rk=rankRows(),pos=rk.findIndex(r=>r.me)+1,n=me();
  $('#screen').innerHTML=`<div class="card pane"><p class="eyebrow">게임 끝</p><h2>${pos===1?'🏆 우리 나라가 1등!':`우리 나라는 ${pos}등!`}</h2>
   <div class="result"><span class="emb" style="background:${n.color};width:76px;height:76px;font-size:42px">${n.emb}</span><div><p class="score">${myScore()}점</p><p class="big">${esc(n.name)} · 임무 ${Math.min(G.mi,3)}/3 · 추가 주문 ${G.bonusDone} · 무역 ${G.trades}번</p></div></div>
   <div style="overflow:auto;max-height:40vh"><table class="rtable"><tr><th>순위</th><th>${MODE==='multi'?'이름':'나라'}</th><th>${MODE==='multi'?'나라':'지도자'}</th><th>임무</th><th>무역</th><th style="text-align:right">점수</th></tr>
   ${rk.map((r,i)=>`<tr class="${r.me?'me':''}"><td>${i+1}</td><td>${esc(r.nm)}${r.me?' (나)':''}</td><td>${esc(MODE==='multi'?r.nat:r.lead)}</td><td>${Math.min(r.m,3)}/3</td><td>${r.tr}</td><td class="n">${r.s}</td></tr>`).join('')}</table></div>
   <div class="box"><b class="step">생각해 봐요</b><p>① 우리 땅에서 캘 수 없어서 꼭 사 와야 했던 물건은? ② 시장 상인(2개→1개)보다 친구와 직접 바꾸는 게 왜 더 좋았나요? ③ 무역을 안 했다면 임무를 할 수 있었을까요?</p></div>
   <div class="row"><button class="btn gold" style="margin-left:auto;font-size:19px" data-act="toTitle">처음으로</button></div></div>`;$('#screen').hidden=false}
function showPin(){ST='pin';$('#screen').innerHTML=`<div class="card pane" style="width:min(460px,100%);text-align:center"><h2>선생님 PIN</h2><p class="muted">4자리 번호를 입력해요.</p>
  <form id="pinform" class="pin">${[0,1,2,3].map(i=>`<input class="field" id="pin${i}" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN ${i+1}번째 자리">`).join('')}</form><p id="pinmsg" class="muted"> </p>
  <div class="row" style="justify-content:center"><button class="btn" data-act="toTitle">취소</button><button class="btn gold" data-act="pinok">확인</button></div></div>`;$('#screen').hidden=false;$('#pin0').focus()}
function checkPin(){const v=[0,1,2,3].map(i=>$('#pin'+i).value).join('');if(window.CLS&&window.FB_ON&&CLS.code){CLS.checkPin(v).then(ok=>{if(ok)enterTeacher();else pinBad()});return}if(v==='1852')enterTeacher();else pinBad()}
function pinBad(){{$('#pinmsg').textContent='번호가 맞지 않아요.';$('#pinmsg').style.color='var(--bad)';[0,1,2,3].forEach(i=>$('#pin'+i).value='');$('#pin0').focus()}}

/* ====================== INPUT ====================== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const k=el.dataset.k,a=el.dataset.act;
  if(a.startsWith('t')&&a!=='tget'&&a!=='tgive'&&MODE==='teacher'&&!['toTitle'].includes(a)){teacherAct(a,k);return}
  switch(a){
   case'sJoin':showJoin();break;case'sSolo':showSolo();break;case'sTeach':showPin();break;case'toTitle':if(MODE==='multi'||MODE==='solo'){if(net.rr&&MODE==='multi'){net.rr.leave().catch(()=>{});net.rr=null}others.clear();G=null}MODE='title';showTitle();break;
   case'q':quality=k;lsSet('btw-q2',k);if(ST==='title')showTitle();else if(ST==='help')showHelp();break;
   case'jgo':doJoin();break;
   case'scount':soloCount=clamp(soloCount+(+k),2,30);lsSet('btw-solo-n',soloCount);showSolo();break;case'sset':soloCount=+k;lsSet('btw-solo-n',soloCount);showSolo();break;
   case'soloPick':page=0;showHow({mode:'solo',slot:+k,days:6,dayLen:75});break;
   case'go':startStudent(pendingStart);break;
   case'resume':ST='play';closeScreen();break;
   case'done':completeMission();break;
   case'tget':trade.get=k;trade.msg=null;renderTrade();break;
   case'tgive':doTrade(k);break;
   case'closeTrade':closeTrade();break;
   case'pst':{const v=(ptrade[el.dataset.s][k]||0)+(+el.dataset.d);ptrade[el.dataset.s][k]=Math.max(0,v);renderPTrade();break}
   case'psend':sendOffer();break;
   case'chmove':chestMove(el.dataset.s,k,el.dataset.n);break;
   case'oyes':answerOffer(true);break;case'ono':answerOffer(false);break;
   case'pinok':checkPin();break;
   case'pnext':page++;showHow();break;case'pprev':page=Math.max(0,page-1);showHow();break;case'pskip':page=5;showHow();break;
   case'cgo':coachGo(1);break;case'cnext':coachGo(coach.step+1);break;case'cskip':case'cdone':endCoach();break;
   case'hbook':page=0;showHow();break;case'hcoach':closeScreen();ST='play';coachGo(1);break;
  }});
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('pin')){const i=+e.target.id.slice(3);e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);if(e.target.value&&i<3)$('#pin'+(i+1)).focus();if(i===3&&e.target.value)checkPin()}
  if(e.target.id==='tcount'){tForm.count=clamp(+e.target.value||2,2,30);renderTeacherSoon()}});
document.addEventListener('change',e=>{if(e.target.id==='tdays')tForm.days=+e.target.value;if(e.target.id==='tdl')tForm.dayLen=+e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='chatform'){sendChat($('#chatin').value);$('#chatin').value='';$('#chatin').blur()}
  if(e.target.id==='tnotice'){const t=$('#tnote').value.trim().slice(0,60);if(t){writeState({notice:{id:Date.now(),t}});addChat('📢 선생님',t,null,true);$('#tnote').value=''}}
  if(e.target.id==='pinform')checkPin()});
$('#prompt').addEventListener('click',talk);$('#talkBtn').addEventListener('click',talk);
$('#jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jumpReq=true});
$('#mineBtn').addEventListener('click',act);
$('#helpBtn').addEventListener('click',()=>{if(ST==='play')showHelp()});
let homeCool=0;$('#homeBtn').addEventListener('click',()=>{if(!G)return;if(ST!=='play'){toast('창을 닫은 뒤에 눌러 주세요.','blue');return}if(isFrozen()){toast('지금은 선생님이 멈춰 두었어요.','bad');return}const now=performance.now();if(now<homeCool){toast(`🏠 ${Math.ceil((homeCool-now)/1000)}초 뒤에 다시 쓸 수 있어요.`,'blue');return}homeCool=now+5000;homeSpawn();toast('🏠 우리 집에 돌아왔어요!','gold');sendPresence(true)});
$('#guideBtn').addEventListener('click',()=>{if(!G)return;G.guide=G.guide===false;toast(G.guide?'🧭 길 안내를 켰어요.':'길 안내를 껐어요.','blue');guideT=0;$('#guideBtn').style.opacity=G.guide?1:.5});
const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')};
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(typing()){if(k==='escape')document.activeElement.blur();return}
  if((ST==='trade'||ST==='ptrade'||ST==='chest')&&k==='escape'){closeTrade();return}
  if(ST!=='play')return;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='enter'&&MODE==='multi'){e.preventDefault();keys.clear();$('#chatin').focus();return}
  keys.add(k);if(k==='e')talk();if(k==='f')act();if(k==='h')$('#homeBtn').click()});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:cam.yaw,p:cam.pitch,id:e.pointerId,t:performance.now(),moved:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.moved=Math.max(drag.moved,Math.hypot(e.clientX-drag.x,e.clientY-drag.y));if(ST!=='play')return;cam.yaw=drag.yaw-(e.clientX-drag.x)*.008;cam.pitch=clamp(drag.p+(e.clientY-drag.y)*.006,.05,1.2)});
cv.addEventListener('pointerup',e=>{if(drag&&drag.moved<6&&performance.now()-drag.t<400&&ST==='play'&&e.pointerType==='mouse')act();drag=null});cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{if(ST!=='play')return;e.preventDefault();cam.dist=clamp(cam.dist+e.deltaY*.01,3,14)},{passive:false});
const joyEl=$('#joy'),knob=$('#knob');let jid=null;
function joyMove(e){const r=joyEl.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}joy={x,y};knob.style.transform=`translate(${x*38}px,${y*38}px)`}
joyEl.addEventListener('pointerdown',e=>{jid=e.pointerId;joyEl.setPointerCapture(jid);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e)});
const joyEnd=()=>{jid=null;joy={x:0,y:0};knob.style.transform=''};joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
if(matchMedia('(pointer: coarse)').matches){$('#joy').hidden=false;$('#tbtn').hidden=false}
setInterval(()=>{if(MODE==='multi'&&G){checkOffers();if(myChat&&Date.now()-mySayAt>8000)myChat=myChat}},1000);

/* ====================== BOOT ====================== */
if(!gl){$('#screen').innerHTML='<div class="pane nogl"><h2>3D 화면을 켤 수 없어요</h2><p class="big">이 기기나 브라우저에서는 3D(WebGL)를 지원하지 않아요. 최신 크롬이나 엣지에서 열어 주세요.</p></div>';$('#screen').hidden=false}
else{initGL();
  if(lsGet('btw-q2',null)===null){let soft=false;try{const ext=gl.getExtension('WEBGL_debug_renderer_info');const rn=ext?String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)):'';soft=/swiftshader|llvmpipe|software|basic render/i.test(rn)}catch(e){}
    if(soft||(navigator.hardwareConcurrency||8)<=4){quality='low';window._autoLow=soft?'soft':'weak'}}
  setupWorld(PRIORITY.slice(0,8),20261105);showTitle();requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});if(window.claude&&window.claude.use)initNet()}
</script>
